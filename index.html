<style>
  :root{
    --bg:#0d0b09;
    --bg2:#161210;
    --yellow:#ffcc00;
    --orange:#ff6b1a;
    --red:#e8261a;
    --cream:#f5f0e6;
    --cream-dim:#c9c0b0;
    --line:#2a2420;
    --card:#171310;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  /* ===== Hero ===== */
  .hero{
    position:relative;
    padding:56px 20px 40px;
    text-align:center;
    overflow:hidden;
    background:
      radial-gradient(ellipse 120% 80% at 50% 100%, rgba(255,107,26,0.35), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, #150f0a 100%);
    border-bottom:1px solid var(--line);
  }
  .flame-wrap{
    position:absolute;
    bottom:-10px;
    left:0; right:0;
    height:180px;
    display:flex;
    justify-content:center;
    gap:2px;
    filter:blur(1px);
    opacity:0.55;
    pointer-events:none;
    z-index:0;
  }
  .flame{
    width:36px;
    height:140px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:linear-gradient(0deg, var(--red) 0%, var(--orange) 45%, var(--yellow) 80%, transparent 100%);
    transform-origin:bottom center;
    animation:flicker 2.4s ease-in-out infinite;
    opacity:0.85;
  }
  .flame:nth-child(2n){animation-duration:2.1s; animation-delay:.2s; height:110px;}
  .flame:nth-child(3n){animation-duration:2.8s; animation-delay:.4s; height:160px;}
  .flame:nth-child(4n){animation-duration:1.9s; animation-delay:.1s; height:95px;}
  @keyframes flicker{
    0%,100%{transform:scaleY(1) scaleX(1) skewX(0deg);}
    25%{transform:scaleY(1.08) scaleX(0.92) skewX(2deg);}
    50%{transform:scaleY(0.94) scaleX(1.05) skewX(-3deg);}
    75%{transform:scaleY(1.05) scaleX(0.95) skewX(1deg);}
  }
  .eyebrow{
    position:relative; z-index:1;
    display:inline-block;
    font-size:13px;
    letter-spacing:0.5px;
    color:var(--orange);
    background:rgba(255,107,26,0.1);
    border:1px solid rgba(255,107,26,0.35);
    padding:5px 16px;
    border-radius:100px;
    margin-bottom:18px;
    font-weight:600;
  }
  .logo{
    position:relative; z-index:1;
    font-family:'Lalezar',sans-serif;
    font-size:clamp(48px, 14vw, 78px);
    line-height:1;
    color:var(--yellow);
    text-shadow:0 0 20px rgba(255,204,0,0.35), 0 4px 0 rgba(0,0,0,0.4);
    letter-spacing:1px;
  }
  .logo span{color:var(--orange);}
  .tagline{
    position:relative; z-index:1;
    margin-top:10px;
    color:var(--cream-dim);
    font-size:15px;
    font-weight:500;
  }
  .hero-meta{
    position:relative; z-index:1;
    margin-top:26px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    font-size:13px;
  }
  .hero-meta a{
    color:var(--cream);
    text-decoration:none;
    background:var(--card);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:10px;
    display:flex;
    align-items:center;
    gap:6px;
    transition:border-color .2s, transform .2s;
  }
  .hero-meta a:active{transform:scale(0.97);}
  .hero-meta a:hover{border-color:var(--orange);}

  /* ===== Nav / category chips ===== */
  .cat-nav{
    position:sticky; top:0; z-index:20;
    background:rgba(13,11,9,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:12px 0;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-nav-inner{display:flex; gap:8px; padding:0 16px;}
  .cat-chip{
    flex:0 0 auto;
    font-family:'Vazirmatn',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--cream-dim);
    background:var(--card);
    border:1px solid var(--line);
    padding:9px 16px;
    border-radius:100px;
    cursor:pointer;
    transition:all .2s;
  }
  .cat-chip.active{
    color:#0d0b09;
    background:var(--yellow);
    border-color:var(--yellow);
  }

  /* ===== Sections ===== */
  .menu-wrap{max-width:720px; margin:0 auto; padding:28px 16px 60px;}
  .section{margin-bottom:36px; scroll-margin-top:70px;}
  .section-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .section-head::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
  }
  .section-title{
    font-family:'Lalezar',sans-serif;
    font-size:26px;
    color:var(--yellow);
    letter-spacing:0.5px;
  }

  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    position:relative;
    transition:border-color .2s;
  }
  .item.special{
    border-color:rgba(255,107,26,0.4);
    background:linear-gradient(135deg, rgba(255,107,26,0.08), var(--card) 40%);
  }
  .item-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .item-name{
    font-size:16.5px;
    font-weight:800;
    color:var(--cream);
  }
  .badge{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    color:#fff;
    background:var(--red);
    padding:2px 8px;
    border-radius:6px;
    margin-inline-start:6px;
    vertical-align:middle;
  }
  .item-desc{
    font-size:13px;
    color:var(--cream-dim);
    margin-top:6px;
    line-height:1.9;
  }
  .item-prices{
    margin-top:12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .price-pill{
    background:rgba(255,204,0,0.08);
    border:1px solid rgba(255,204,0,0.25);
    border-radius:9px;
    padding:6px 12px;
    font-size:12.5px;
    color:var(--cream-dim);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    min-width:80px;
  }
  .price-pill b{
    color:var(--yellow);
    font-size:13.5px;
    font-weight:800;
    font-family:'Vazirmatn',sans-serif;
    white-space:nowrap;
  }
  .price-single{
    margin-top:12px;
    font-family:'Vazirmatn',sans-serif;
    font-weight:800;
    font-size:19px;
    color:var(--yellow);
  }
  .price-single small{
    color:var(--cream-dim);
    font-weight:500;
    font-size:12px;
    margin-inline-start:4px;
  }

    border-top:1px solid var(--line);

    text-align:center;
    background:#100d0a;

  .loading{

  }
  .spinner{
    width:18px; height:18px;
    border:2.5px solid var(--line);
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

function renderMenu(data){
  const nav = document.getElementById('catNav');
  const wrap = document.getElementById('menuWrap');
  nav.innerHTML = '';
  wrap.innerHTML = '';

    chip.className = 'cat-chip' + (ci===0 ? ' active' : '');
    chip.textContent = cat.title;
    chip.onclick = () => {
      document.getElementById('sec-'+cat.id).scrollIntoView({behavior:'smooth', block:'start'});
      document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
    };
    nav.appendChild(chip);

    const section = document.createElement('section');
    section.className = 'section';
    section.id = 'sec-' + cat.id;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<div class="section-title">${cat.title}</div>`;
    section.appendChild(head);

    cat.items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'item' + (item.tag ? ' special' : '');

      let pricesHtml = '';
      if(item.prices){
        pricesHtml = '<div class="item-prices">' + Object.entries(item.prices).map(([label, price]) =>
          `<div class="price-pill"><span>${label}</span><b>${toman(price)} تومان</b></div>`
        ).join('') + '</div>';
      } else if(item.single !== undefined){
        pricesHtml = `<div class="price-single">${toman(item.single)} <small>تومان</small></div>`;
      }

      el.innerHTML = `
        <div class="item-top">
          <div class="item-name">${item.name}${item.tag ? `<span class="badge">${item.tag}</span>` : ''}</div>
        </div>
        ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
        ${pricesHtml}
      `;
      section.appendChild(el);
    });

    wrap.appendChild(section);
  });
}

async function loadMenu(){
  if(!JSONBLOB_ID || JSONBLOB_ID === "PENDING_SETUP"){
    renderMenu(FALLBACK_DATA);
    return;
  }
  try{
    const res = await fetch(`https://jsonblob.com/api/jsonBlob/${JSONBLOB_ID}`);
    if(!res.ok) throw new Error('fetch failed');
    const stored = await res.json();
    renderMenu(stored.menuData || stored);
  }catch(e){
    renderMenu(FALLBACK_DATA);
  }
}

loadMenu();
</script>
