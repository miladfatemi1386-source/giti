<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ورود مدیریت | پیتزا گیتی</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --char:#120e0a;
    --ember:#f2b705;
    --flame:#d94f04;
    --deep-red:#8a1c0f;
    --smoke:#efe6d8;
    --smoke-dim:#b8ab97;
    --line:#3a2f24;
    --ticket:#1a140f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:
      radial-gradient(ellipse 90% 55% at 50% 0%, rgba(217,79,4,0.2), transparent 60%),
      var(--char);
    color:var(--smoke);
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .box{
    width:100%;
    max-width:400px;
    background:var(--ticket);
    border:1px solid var(--line);
    border-radius:6px;
    padding:34px 26px;
    text-align:center;
  }
  .brand{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:32px;
    color:var(--ember);
  }
  .brand .fa{color:var(--flame);}
  .sub{
    color:var(--smoke-dim);
    font-size:13px;
    margin-top:8px;
    margin-bottom:28px;
    line-height:1.9;
  }
  label{
    display:block;
    text-align:right;
    font-size:12.5px;
    color:var(--smoke-dim);
    margin-bottom:6px;
  }
  input{
    width:100%;
    background:var(--char);
    border:1px solid var(--line);
    border-radius:6px;
    padding:13px 14px;
    color:var(--smoke);
    font-family:'Vazirmatn',sans-serif;
    font-size:15px;
    margin-bottom:14px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--flame);}
  button{
    width:100%;
    background:linear-gradient(135deg, var(--flame), var(--deep-red));
    color:var(--smoke);
    border:none;
    border-radius:6px;
    padding:14px;
    font-family:'Vazirmatn',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    margin-top:4px;
    transition:transform .12s, opacity .12s;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.55; cursor:default;}
  .error{
    color:#ff8163;
    font-size:12.5px;
    margin-top:13px;
    min-height:15px;
  }
  .back{
    display:inline-block;
    margin-top:20px;
    color:#5c5148;
    font-size:12px;
    text-decoration:none;
  }
  .link-box{
    margin-top:18px;
    background:var(--char);
    border:1px solid rgba(242,183,5,0.3);
    border-radius:6px;
    padding:14px;
    display:none;
  }
  .link-box.show{display:block;}
  .link-box p{
    font-size:11.5px;
    color:var(--smoke-dim);
    margin-bottom:8px;
    line-height:1.8;
    text-align:right;
  }
  .link-box .url{
    font-size:10.5px;
    color:var(--ember);
    word-break:break-all;
    text-align:left;
    direction:ltr;
    background:rgba(242,183,5,0.06);
    padding:8px 10px;
    border-radius:5px;
    margin-bottom:8px;
  }
  .copy-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--smoke);
    font-size:12px;
    padding:9px;
    border-radius:6px;
  }
</style>
</head>

function renderLoginForm(){
  document.getElementById('subText').textContent = 'ورود به پنل مدیریت منو';
  document.getElementById('formArea').innerHTML = `
    <label for="pass">رمز عبور</label>
    <input type="password" id="pass" placeholder="رمز عبور را وارد کنید" autocomplete="current-password">
    <button id="submitBtn">ورود</button>
    <div class="error" id="errMsg"></div>
  `;
  document.getElementById('submitBtn').onclick = doLogin;
  document.getElementById('pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('pass').focus();
}

async function doLogin(){
  const pass = document.getElementById('pass').value;
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errMsg');
  if(!pass){ err.textContent = 'رمز عبور را وارد کن'; return; }

  btn.disabled = true;
  btn.textContent = 'در حال بررسی...';
  err.textContent = '';

  try{
    const res = await fetch(`https://jsonblob.com/api/jsonBlob/${blobId}`);
    if(!res.ok) throw new Error('fetch-fail');
    const stored = await res.json();
    if(stored.password === pass){
      localStorage.setItem(STORAGE_KEY_NAME, blobId);
      sessionStorage.setItem('gheiti_admin_auth', 'true');
      window.location.href = `gheiti-menu-admin.html?key=${encodeURIComponent(blobId)}`;
    } else {
      err.textContent = 'رمز عبور اشتباه است';
      btn.disabled = false;
      btn.textContent = 'ورود';
    }
  }catch(e){
    err.textContent = 'خطا در اتصال به سرور. دوباره تلاش کن.';
    btn.disabled = false;
    btn.textContent = 'ورود';
  }
}

function renderSetupForm(){
  document.getElementById('subText').innerHTML = 'این اولین باریه که پنل رو راه‌اندازی می‌کنی.<br>یک رمز عبور دلخواه انتخاب کن.';
  document.getElementById('formArea').innerHTML = `
    <label for="newPass">رمز عبور دلخواه</label>
    <input type="password" id="newPass" placeholder="یک رمز انتخاب کن" autocomplete="new-password">
    <label for="newPass2">تکرار رمز عبور</label>
    <input type="password" id="newPass2" placeholder="رمز را دوباره وارد کن" autocomplete="new-password">
    <button id="setupBtn">ساخت پنل مدیریت</button>
    <div class="error" id="errMsg"></div>
    <div class="link-box" id="linkBox">
      <p>پنل با موفقیت ساخته شد. این دو لینک را ذخیره کن:</p>
      <p style="margin-bottom:4px; color:var(--ember);">لینک پنل مدیریت:</p>
      <div class="url" id="adminLink"></div>
      <p style="margin-bottom:4px; color:var(--ember);">لینک منوی سایت (همیشه به‌روز):</p>
      <div class="url" id="menuLink"></div>
      <button class="copy-btn" id="copyBtn" type="button">کپی هر دو لینک</button>
    </div>
  `;
  document.getElementById('setupBtn').onclick = doSetup;
}

async function doSetup(){
  const p1 = document.getElementById('newPass').value;
  const p2 = document.getElementById('newPass2').value;
  const err = document.getElementById('errMsg');
  const btn = document.getElementById('setupBtn');

  if(!p1 || p1.length < 4){ err.textContent = 'رمز باید حداقل ۴ کاراکتر باشد'; return; }
  if(p1 !== p2){ err.textContent = 'رمزهای وارد شده یکسان نیستند'; return; }

  btn.disabled = true;
  btn.textContent = 'در حال ساخت...';
  err.textContent = '';

  try{
    const res = await fetch('https://jsonblob.com/api/jsonBlob', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: p1, menuData: FALLBACK_MENU })
    });
    if(!res.ok) throw new Error('create-fail');
    const location = res.headers.get('Location') || res.headers.get('location');
    const newId = location ? location.split('/').pop() : '';
    if(!newId) throw new Error('no-id');

    localStorage.setItem(STORAGE_KEY_NAME, newId);
    sessionStorage.setItem('gheiti_admin_auth', 'true');

    const base = window.location.origin + window.location.pathname.replace('gheiti-menu-login.html','');
    const adminFullLink = base + `gheiti-menu-admin.html?key=${newId}`;
    const menuFullLink = base + `index.html?key=${newId}`;

    document.getElementById('adminLink').textContent = adminFullLink;
    document.getElementById('menuLink').textContent = menuFullLink;
    document.getElementById('linkBox').classList.add('show');
    document.getElementById('copyBtn').onclick = () => {
      navigator.clipboard.writeText(`پنل مدیریت: ${adminFullLink}\nمنوی سایت: ${menuFullLink}`).then(()=>{
        document.getElementById('copyBtn').textContent = 'کپی شد ✓';
        setTimeout(()=>{ document.getElementById('copyBtn').textContent = 'کپی هر دو لینک'; }, 1800);
      });
    };
    btn.textContent = 'ورود به پنل';
    btn.disabled = false;
    btn.onclick = () => { window.location.href = `gheiti-menu-admin.html?key=${newId}`; };
  }catch(e){
    err.textContent = 'خطا در ساخت پنل. اتصال اینترنت را بررسی کن و دوباره تلاش کن.';
    btn.disabled = false;
    btn.textContent = 'ساخت پنل مدیریت';
  }
}

if(blobId){ renderLoginForm(); } else { renderSetupForm(); }
</script>

</html>
